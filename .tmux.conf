# Options

set -g prefix C-a
set -g mouse on

set -g mode-keys vi
set -g status-keys vi

set -g default-terminal "tmux-256color"

# Undercurl support
set -as terminal-overrides ',*:Tc' # True color support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # Undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # Colored undercurl support (Windows Terminal)
# set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # Colored undercurl support (Other Terminals)

# Bindings

bind-key -T prefix C-a send-prefix

bind-key -T prefix '_' split-window -c "#{pane_current_path}"
bind-key -T prefix '|' split-window -hc "#{pane_current_path}"

bind-key -r -T prefix 'k' select-pane -U # Vim-like pane navigation
bind-key -r -T prefix 'j' select-pane -D
bind-key -r -T prefix 'h' select-pane -L
bind-key -r -T prefix 'l' select-pane -R

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect' # Required for tmux-continuum
set -g @plugin 'tmux-plugins/tmux-continuum' # Persistent tmux sessions

# Plugin options
set -g @continuum-restore 'on'

# Install plugin manager
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Run plugin manager
run '~/.tmux/plugins/tpm/tpm'




